<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>

    <div class="container">
        <div class="box mt-6">
            <form onsubmit="return submitHandler()">
                <div class="columns">
                    <div class="column is-8">
                        <div class="field">
                            <label class="label" for="product_title">Product title</label>
                            <div class="control">
                                <input class="input" id="product_title" type="text" placeholder="Enter product tittle">
                            </div>
                        </div>
                    </div>

                    <div class="column is-2">
                        <div class="field">
                            <label class="label" for="product_price">Product title</label>
                            <div class="control">
                                <input class="input" id="product_price" type="number" placeholder="0.00">
                            </div>
                        </div>
                    </div>
                    <div class="column is-1">
                        <div class="field">
                            <label class="label" for="product_qty">Quantity</label>
                            <div class="control">
                                <input class="input" id="product_qty" type="number" min="1" max="100" value="1">
                            </div>
                        </div>
                    </div>
                    <div class="column is-1 is-align-self-flex-end">
                        <button type="submit" class="button is-primary" >Add</button>
                    </div>
                </div>
            </form>
        </div>

    </div>
    <script scr="./assets/js/dist/main.js"></script>
</body>

</html>
