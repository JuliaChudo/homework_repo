<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Delius+Unicase:wght@400;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Photography</title>
</head>

<body>
    <main>
        <div class="page-wrapper">
            <section>
                <div class="container">
                    <h2>Architectural Photography</h2>
                    <div class="grid-container">
                        <img src="./assets/img/arhitectural/arh1.png" class="box" alt="">
                        <img src="./assets/img/arhitectural/arh2.png" class="box cols-2" alt="">
                        <img src="./assets/img/arhitectural/arh3.png" class="box cols-2" alt="">
                        <img src="./assets/img/arhitectural/arh4.png" class="box" alt="">
                        <img src="./assets/img/arhitectural/arh5.png" class="box" alt="">
                        <img src="./assets/img/arhitectural/arh6.png" class="box cols-2" alt="">
                    </div>
                </div>
            </section>
            <section>
                <div class="container">
                    <h2>Still Life Photography</h2>
                    <div class="grid-container">
                        <img src="./assets/img/still_life/sl1.png" class="box" alt="">
                        <img src="./assets/img/still_life/sl2.png" class="box cols-2" alt="">
                        <img src="./assets/img/still_life/sl3.png" class="box cols-2 rows-2" alt="">
                        <img src="./assets/img/still_life/sl4.png" class="box rows-2" alt="">
                        <img src="./assets/img/still_life/sl5.png" class="box cols-2" alt="">
                        <img src="./assets/img/still_life/sl6.png" class="box" alt="">
                    </div>
                </div>
            </section>
            <section>
                <div class="container">
                    <h2>Portrait and Fashion Photography</h2>
                    <div class="grid-container">
                        <img src="./assets/img/portrait/p1.png" alt="">
                        <img src="./assets/img/portrait/p2.png" class="rows-2" alt="">
                        <img src="./assets/img/portrait/p3.png" alt="">
                        <img src="./assets/img/portrait/p4.png" alt="">
                        <img src="./assets/img/portrait/p5.png" class="rows-2" alt="">
                        <img src="./assets/img/portrait/p6.png" class="rows-2" alt="">
                        <img src="./assets/img/portrait/p7.png" alt="">
                        <img src="./assets/img/portrait/p8.png" class="cols-2" alt="">
                        <img src="./assets/img/portrait/p9.png" class="cols-2" alt="">
                        <img src="./assets/img/portrait/p10.png" alt="">
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
