<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="block grey-pink">
        <h1>CSS Dinner Shopping List</h1>
        <p>Let’s go to the mall!</p>
    </header>
    <main>
        <div class="block">
            <ul>
                <li class="container check">
                    <div>
                        <label>
                            <input type="checkbox">
                            <span class="text">A lot of pickles</span>
                            <span class="little_text lparenthes rparenthes">for the next lessons about CSS</span>
                        </label>
                    </div>
                </li>
                <li class="container check">
                    <div>
                        <label>
                            <input type="checkbox">
                            <span class="text">10 apples</span>
                            <span class="little_text lparenthes rparenthes">for more CSS manipulations</span>
                        </label>
                    </div>
                </li>
                <li class="container check">
                    <div>
                        <label>
                            <input type="checkbox">
                            <span class="text">20 oranges</span>
                            <span class="little_text lparenthes rparenthes">
                                because they are awesome
                            </span>

                        </label>
                    </div>
                </li>
                <li class="container check">
                    <div>
                        <label>
                            <input type="checkbox">
                            <span class="text">13 plates</span>
                            <span class="little_text lparenthes rparenthes">
                                hm... they always dissapear
                            </span>
                        </label>
                    </div>
                </li>
                <li class="container check">
                    <div>
                        <label>
                            <input type="checkbox">
                            <span class="text">15 bentos</span>
                        </label>
                    </div>
                </li>
                <li class="container check">
                    <div>
                        <label>
                            <input type="checkbox">
                            <span class="text">1 bottle of Sake</span>
                            <span class="little_text lparenthes rparenthes">
                                for my friends
                            </span>
                        </label>
                    </div>
                </li>
            </ul>
        </div>
    </main>
    <footer>
        <div class="container block grey-pink">
            Bon appetit :)
        </div>
    </footer>
</body>

</html>
