<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="grey-pink">
        <h1>CSS Dinner Shopping List</h1>
        <p>Let’s go to the mall!</p>
    </header>
    <main>
        <section>
            <form method="post" action="#">
                <ul>
                    <li class="container check">
                        <label>
                            <div>
                                <input type="checkbox" name="pickles">
                                <span class="text">A lot of pickles</span>
                            </div>
                        </label>
                    </li>
                    <li class="container check">
                        <label>
                            <div>
                                <input type="checkbox" name="apples">
                                <span class="text">10 apples</span>
                            </div>
                        </label>
                    </li>
                    <li class="container check">
                        <label>
                            <div>
                                <input type="checkbox" name="oranges">
                                <span class="text">20 oranges</span>
                            </div>
                        </label>
                    </li>
                    <li class="container check">
                        <label>
                            <div>
                                <input type="checkbox" name="plates">
                                <span class="text">13 plates</span>
                            </div>
                        </label>
                    </li>
                    <li class="container check">
                        <label>
                            <div>
                                <input type="checkbox" name="bentos">
                                <span class="text">15 bentos</span>
                            </div>
                        </label>
                    </li>
                    <li class="container check">
                        <label>
                            <div>
                                <input type="checkbox" name="sake">
                                <span class="text">1 bottle of Sake</span>
                            </div>
                        </label>
                    </li>
        </section>
    </main>
    <footer>
        <section class="container">
            <div class="grey-pink">Bon appetit :)</div>
        </section>
    </footer>
</body>

</html>
